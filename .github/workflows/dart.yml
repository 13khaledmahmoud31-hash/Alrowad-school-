name: Build Al-Rowad School APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project if Missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.alrowad.school --project-name alrowad_private_school /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
            sed -i 's/android:label="[^"]*"/android:label="مدرسة الرواد الخاصة"/' android/app/src/main/AndroidManifest.xml
          fi
          ls -la android/app

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlRowad-School-APK
          path: build/app/outputs/flutter-apk/app-release.apk
